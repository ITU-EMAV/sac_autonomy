# Overlay: the steering drives the prediction; the wheel speed is a measurement (so a slipping
# or locked wheel can be rejected), as for dynamic_bicycle.
/**:
  ros__parameters:
    motion_model:
      type: kinematic_bicycle
      input: wheels
      speed_from: state           # state: wheel speed as a measurement; input: as the input
      wheel_base: 1.873
      speed_noise: 0.1            # [m/s]
      steering_noise: 0.01        # [rad]
    sensors:
      wheels:
        as_input: true            # the steering for the model
        also_measure: true        # and the speed as a measurement
        use: [speed]              # not the yaw rate: the model makes it from the steering
