# Overlay: the middle IMU drives the prediction (strapdown) instead of being a measurement.
/**:
  ros__parameters:
    motion_model:
      type: imu_driven
      input: middle_imu
      gyro_noise: 0.003           # [rad/s] per reading
      accel_noise: 0.1            # [m/s^2] per reading
    sensors:
      middle_imu:
        as_input: true
