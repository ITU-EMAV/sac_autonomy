# Over sim_local.yaml (localization.launch.py lidar_odometry:=fast_lio): the lidar-inertial
# odometry's motion as a velocity measurement of the local filter. Its velocities come from
# its consecutive poses (it publishes no twist), in its body frame, the middle IMU's.
localization_local:
  ros__parameters:
    sensors:
      names: [middle_imu, front_imu, back_imu, wheels, standstill, nonholonomic, lio]
      lio:
        type: odometry
        topic: /sac/localization/lio/odometry
        velocity_from_pose: true
        frame: middle_imu_frame          # FAST-LIO's "body"
        use: [linear_velocity, angular_velocity]
        linear_velocity_covariance: [0.01, 0.01, 0.01]      # [m/s]^2
        angular_velocity_covariance: [1.0e-4, 1.0e-4, 1.0e-4]
