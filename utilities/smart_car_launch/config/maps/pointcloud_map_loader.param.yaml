/**:
  ros__parameters:
    enable_whole_load: true
    enable_downsampled_whole_load: true
    enable_partial_load: true
    enable_selected_load: true
    enable_differantial_load: true

    # only used when downsample_whole_load enabled
    leaf_size: 2.0 # downsample leaf size [m]
    pcd_paths_or_directory: [$(var pcd_paths_or_directory)] # Path to the pointcloud map file or directory
    pcd_metadata_path: $(var pcd_metadata_path) # Path to pointcloud metadata file
    differential_server_service_name: "get_differential_pointcloud_map"

